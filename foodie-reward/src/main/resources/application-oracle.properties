spring.datasource.url=${FOODIE_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${FOODIE_DB_USERNAME:foodie_app}
spring.datasource.password=${FOODIE_DB_PASSWORD:foodie_app}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=never
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.baseline-on-migrate=false
