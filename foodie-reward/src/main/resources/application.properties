spring.application.name=FoodieReward
server.port=8081

# Free local database. The file keeps changes after the application restarts.
spring.datasource.url=jdbc:h2:file:./data/foodie-reward;MODE=Oracle;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
# schema.sql runs automatically; demo records are inserted by DemoDataSeeder only when the database is empty.
spring.sql.init.data-locations=classpath:empty.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.web.resources.cache.period=0
